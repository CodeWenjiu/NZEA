[workspace]
resolver = "2"
members = [
    "crates/*",
    "probe/*",
    "pulse/*",
]

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.4", features = ["derive", "env"] }
libc = "0.2"
nzea_macro = { path = "crates/nzea_macro" }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
proptest = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tabled = { version = "0.18.0", default-features = false, features = ["std"] }
thiserror = "2.0.18"
tracing = "0.1.44"
wellen = "0.25.6"
winnow = "1.0.3"

[profile.release]
# Keep unwinding: wellen's FST reader asserts on malformed blocks (the
# half-written tail of a dump whose writer was killed), and pulse turns that
# panic into a plain error instead of aborting the process.
panic         = "unwind"
incremental   = true

# Bench-only profile for more informative flamegraphs:
# - keep symbols (`debug = 1`, `strip = "none"`)
# - disable LTO so call stacks don't get flattened as aggressively
[profile.bench]
inherits = "release"
debug = 1
strip = "none"

[workspace.lints.rust]
unreachable_pub = "warn"