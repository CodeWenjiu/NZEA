[workspace]
resolver = "2"
members = [
    "pulse_macro",
    "pulse_cli",
    "pulse_wave",
]

[profile.release]
panic         = "abort"
incremental   = true

# Bench-only profile for more informative flamegraphs:
# - keep symbols (`debug = 1`, `strip = "none"`)
# - disable LTO so call stacks don't get flattened as aggressively
[profile.bench]
inherits = "release"
debug = 1
strip = "none"

[workspace.dependencies]
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
winnow = "1.0.3"
clap = { version = "4.6.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tabled = { version = "0.18.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unreachable_pub = "warn"
