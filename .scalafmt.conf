version = "3.8.3"
runner.dialect = scala3
maxColumn = 120
indent.main = 4
indent.callSite = 4
indent.defnSite = 4
indent.ctrlSite = 4
indent.extendSite = 4
indent.significant = 4
align.preset = some
align.openParenCtrlSite = false
newlines.topLevelStatementBlankLines = [
  { blanks = 1 }
]
rewrite.rules = [SortImports]
